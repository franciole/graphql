  query GET_POSTS {
	posts (input: {
		_sort: "indexRef"
		_order: "desc"
		_start: 0
		_limit: 1
	}){
    id
    title
    body
    indexRef
    createdAt
  }
}

query GET_USERS {
  users(input:  {
     _sort: "indexRef"
     _order: "desc"
     _start: 0
     _limit: 1
  }) {
    id
    firstName
    lastName
    userName
    indexRef
    createdAt
  }
}


query GET_USERS(
  $sort: String = "inddexRef"
  $order: ApiFilterOrder = DESC
  $start: Int = 0
  $limit: Int = 5
) {
  users(input:  {
     _sort: $sort
     _order: $order
     _start: $start
     _limit: $limit
  }) {
    id
    firstName
    lastName
    userName
    indexRef
    createdAt
  }
}


query GET_POST {
  post (id: 8600) {
    __typename

   ... on Post {
    id
    title
   }

   ... on PostError {
    statusCode
    message

    ... on PostNotFoundError{
      postId
    }

    ... on PostTimeoutError {
      timeout
    }
   }
  }
}
